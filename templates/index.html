<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificador Alzheimer</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }
    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      border-radius: 10px;
      width: 95%;
      max-width: 1000px;
    }
    .close {
      float: right;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #eee;
    }
    button svg {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
    <div class="main-layout">
      <div class="card">
        <h1 class="title">Detección de Alzheimer</h1>
        <p class="subtitle">Llena los datos del paciente, sube una imagen MRI y obtén una predicción.</p>

        <!-- Formulario corregido -->
        <form id="upload-form" class="form-card" action="/predict" method="post" enctype="multipart/form-data">
          <label for="nombre" class="file-label">Nombre del paciente:</label>
          <input type="text" id="nombre" name="nombre" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+" title="Solo letras y espacios" />

          <label for="cedula" class="file-label">Cédula/ID:</label>
          <input type="text" id="cedula" name="cedula" required pattern="\d+" title="Solo números" />

          <label for="edad" class="file-label">Edad:</label>
          <input type="number" id="edad" name="edad" required min="0" max="120" />

          <label for="sexo" class="file-label">Sexo:</label>
          <select id="sexo" name="sexo" required>
            <option value="">Selecciona</option>
            <option value="Femenino">Femenino</option>
            <option value="Masculino">Masculino</option>
            <option value="Otro">Otro</option>
          </select>

          <label for="image" class="file-label">Sube imagen MRI:</label>
          <input type="file" id="image" name="file" accept="image/*" required />

          <div class="btn-group">
            <button type="submit" class="btn">Predecir</button>
            <button type="button" id="clear-btn" class="btn">Limpiar</button>
            <button type="button" id="ver-registros-btn" class="btn">Ver registros</button>
          </div>
        </form>

        <div id="preview-container" class="card preview-card">
          <img id="preview" src="#" alt="Vista previa" style="display: none;" />
        </div>

        <div id="result" class="card result-card"></div>
      </div>
    </div>

    <footer>
      <p>© 2025 Proyecto TESIS • IA en salud</p>
    </footer>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" id="cerrar-modal">&times;</span>
      <h2>Registros de pacientes</h2>
      <table id="tabla-registros">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

 <script>
  const form = document.getElementById('upload-form');
  const resultDiv = document.getElementById('result');
  const previewImg = document.getElementById('preview');
  const clearBtn = document.getElementById('clear-btn');
  const imageInput = document.getElementById('image');
  const modal = document.getElementById('modal');
  const cerrarModal = document.getElementById('cerrar-modal');
  const verRegistrosBtn = document.getElementById('ver-registros-btn');

  form.addEventListener('submit', async (e) => {
      e.preventDefault(); // evita el envío tradicional del formulario

      const nombre = document.getElementById('nombre').value.trim();
      const cedula = document.getElementById('cedula').value.trim();
      const soloLetras = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
      const soloNumeros = /^\d+$/;

      // Validaciones
      if (!soloLetras.test(nombre)) {
          alert('El nombre solo debe contener letras y espacios.');
          return;
      }
      if (!soloNumeros.test(cedula)) {
          alert('La cédula debe contener solo números.');
          return;
      }

      const file = imageInput.files[0];
      if (!file) {
          alert('Debes seleccionar una imagen.');
          return;
      }

      // Mostrar preview de imagen
      const reader = new FileReader();
      reader.onload = () => {
          previewImg.src = reader.result;
          previewImg.style.display = 'block';
      };
      reader.readAsDataURL(file);

      // Enviar formulario al backend
      const formData = new FormData(form);
      try {
          const response = await fetch('/predict', {
              method: 'POST',
              body: formData
          });

          const data = await response.json();

          if (data.diagnostico && data.lobulo_afectado && data.nivel_danio !== undefined) {
              resultDiv.innerHTML = `
                  <p><strong>Diagnóstico:</strong> ${data.diagnostico}</p>
                  <p><strong>Lóbulo afectado:</strong> ${data.lobulo_afectado}</p>
                  <p><strong>Nivel de daño:</strong> ${data.nivel_danio}</p>
              `;
          } else if (data.error) {
              resultDiv.innerText = `Error: ${data.error}`;
          } else {
              resultDiv.innerText = 'Error desconocido.';
          }

          resultDiv.classList.add('visible');

      } catch (err) {
          console.error(err);
          resultDiv.innerText = 'Error en la conexión con el servidor.';
      }
  });


  clearBtn.addEventListener('click', () => {
    form.reset();
    previewImg.src = '#';
    previewImg.style.display = 'none';
    resultDiv.innerText = '';
    resultDiv.classList.remove('visible');
  });

  verRegistrosBtn.addEventListener('click', async () => {
    try {
      const response = await fetch('/registros');
      const data = await response.json();

      if (!Array.isArray(data)) {
        alert(data.error || 'Error inesperado al cargar registros.');
        return;
      }

      const thead = document.querySelector('#tabla-registros thead');
      const tbody = document.querySelector('#tabla-registros tbody');
      thead.innerHTML = ''; tbody.innerHTML = '';

      if (data.length > 0) {
        const headers = Object.keys(data[0]);
        const headerRow = document.createElement('tr');
        headers.forEach(key => {
          const th = document.createElement('th');
          th.textContent = key;
          headerRow.appendChild(th);
        });
        const thAcc = document.createElement('th');
        thAcc.textContent = 'Acciones';
        headerRow.appendChild(thAcc);
        thead.appendChild(headerRow);

        data.forEach(row => {
          const tr = document.createElement('tr');
          headers.forEach(key => {
            const td = document.createElement('td');
            td.textContent = row[key];
            if (key !== 'Cédula') td.contentEditable = true;
            tr.appendChild(td);
          });

          const tdBtns = document.createElement('td');

          const btnEditar = document.createElement('button');
          btnEditar.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='1.5' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' d='M16.862 4.487l1.687 1.687a1.5 1.5 0 010 2.121L7.5 19.344 3 21l1.656-4.501L16.862 4.487z' /></svg>`;
          btnEditar.title = 'Editar';
          btnEditar.onclick = async () => {
            const celdas = tr.querySelectorAll('td');
            const registro = headers.reduce((acc, k, i) => {
              acc[k] = celdas[i].textContent.trim();
              return acc;
            }, {});
            await fetch('/actualizar-registro', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(registro)
            });
            alert('Registro actualizado');
            verRegistrosBtn.click();
          };

          const btnEliminar = document.createElement('button');
          btnEliminar.innerHTML = `<svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='1.5' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' d='M6 18L18 6M6 6l12 12' /></svg>`;
          btnEliminar.title = 'Eliminar';
          btnEliminar.onclick = async () => {
            const cedula = row['Cédula'];
            if (confirm(`¿Eliminar paciente con cédula ${cedula}?`)) {
              await fetch('/eliminar-registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cedula })
              });
              alert('Registro eliminado');
              verRegistrosBtn.click();
            }
          };

          tdBtns.appendChild(btnEditar);
          tdBtns.appendChild(btnEliminar);
          tr.appendChild(tdBtns);
          tbody.appendChild(tr);
        });

        modal.style.display = 'block';
      } else {
        alert('No hay registros disponibles.');
      }
    } catch (err) {
      alert('Error al cargar los registros.');
    }
  });

  cerrarModal.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  window.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.style.display = 'none';
    }
  });
</script>


</body>
</html>
